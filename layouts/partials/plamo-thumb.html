<span class="plamo-thumb">
  {{ $thumb := .Resources.GetMatch "thumbnail.*" }}
  {{ if not $thumb }}
    {{ $imgs := .Resources.ByType "image" }}
    {{ with $imgs }}
      {{ $thumb = index . 0 }}
    {{ end }}
  {{ end }}
  {{ with $thumb }}
  <img src="{{ .RelPermalink }}" alt="{{ $.Title }}">
  {{ else }}
  <span class="plamo-thumb-empty">写真なし</span>
  {{ end }}
</span>
