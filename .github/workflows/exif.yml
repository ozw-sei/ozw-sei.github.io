name: image metadata

on:
  pull_request:
    branches:
      - source
  push:
    branches:
      - source

permissions:
  contents: read

jobs:
  check-exif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install exiftool
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Reject EXIF and GPS
        run: scripts/strip-exif.sh --check
