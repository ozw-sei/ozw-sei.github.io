name: github pages

on:
  push:
    branches:
      - source

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build
        run: |
          hugo --minify
          test -s public/index.html
          test -s public/about/index.html
          test -s public/plamo/index.html
          test -s public/plamo/mosasaurus/index.html
          grep -q "モササウルス" public/plamo/index.html
          grep -q "制作中" public/plamo/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
