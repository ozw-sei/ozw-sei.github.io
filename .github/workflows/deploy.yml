name: github pages

on:
  push:
    branches:
      - source

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Reject image EXIF
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
          scripts/strip-exif.sh --check

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Setup Dart Sass
        run: |
          curl -fsSL -o /tmp/dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/1.106.1/dart-sass-1.106.1-linux-x64.tar.gz
          sudo tar -C /usr/local -xzf /tmp/dart-sass.tar.gz
          echo /usr/local/dart-sass >> "$GITHUB_PATH"

      - name: Build
        run: |
          hugo --minify
          test -s public/index.html
          test -s public/about/index.html
          test -s public/plamo/index.html
          test -s public/plamo/mosasaurus/index.html
          grep -q "モササウルス" public/plamo/index.html
          grep -q "制作中" public/plamo/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
